    body {
      height: 200vh;
      margin: 0;
      padding: 0;

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: blue;
    }

    img {
      width: 80%;
      /* max-width: 1000px; */
      /* object-fit: cover; */
      transition: width 0.1s ease-out;
    }
  </style>
</head>
<body>

  <script>
    const img = document.getElementById("scrollImage");


    window.addEventListener("scroll", () => {

    const sixtyPercentViewport = window.innerHeight * 0.6;
    const imageTop = img.getBoundingClientRect().top;
    const distanceScrolled = window.innerHeight - imageTop;
  


    // const scrollPast = Math.max(0, scrollY + sixtyPercentViewport - imageTop);
      let scaleFactor = Math.min(distanceScrolled / sixtyPercentViewport, 1);

      const scalePercent = 80 + (20 * scaleFactor);
        img.style.width = `${scalePercent}%`;
        
    });

  </script>
